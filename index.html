<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Money River</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@400;600;700&display=swap">
<style>
:root{--bg:#000;--card:#0E1315;--ink:#EEF4F5;--soft:#95A7AC;--line:#1F282B;--water:#4FB3C6;--bad:#FF8A93;color-scheme:dark}
*{box-sizing:border-box} [hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,sans-serif;
 display:grid;place-items:center;
 padding-block:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-bottom,0px));
 padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:30px 26px 26px}
.dots{display:flex;gap:7px;margin-bottom:20px}
.dots span{width:14px;height:22px;border-radius:5px;background:var(--c)}
h1{font-family:"Baloo 2",system-ui,sans-serif;font-weight:800;font-size:2rem;line-height:1.05;margin:0 0 .35rem}
p.sub{color:var(--soft);margin:0 0 1.4rem;line-height:1.5}
label{display:block;font-weight:700;font-size:.85rem;margin-bottom:.4rem}
input{width:100%;font:inherit;font-size:1rem;color:var(--ink);background:#000;border:1px solid var(--line);
 border-radius:12px;padding:12px 14px}
input:focus{outline:2px solid var(--water);outline-offset:1px;border-color:transparent}
button{margin-top:12px;width:100%;font-family:"Baloo 2",system-ui,sans-serif;font-weight:700;font-size:1.05rem;
 color:#04222A;background:var(--water);border:0;border-radius:12px;padding:11px 14px;cursor:pointer}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button[disabled]{opacity:.6;cursor:progress}
.msg{margin:.9rem 0 0;font-size:.9rem;color:var(--bad)}
</style>
</head>
<body>
<main>
  <div class="dots" aria-hidden="true"><span style="--c:#E8803A"></span><span style="--c:#3D7DD8"></span><span style="--c:#E6476B"></span><span style="--c:#F2B53C"></span><span style="--c:#8E7CC3"></span><span style="--c:#2FA8A0"></span><span style="--c:#4C9F4A"></span></div>
  <h1>Money River</h1>
  <p class="sub">This page is private. Enter the password to open it.</p>
  <form id="f">
    <label for="pw">Password</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required>
    <button id="go" type="submit">Open</button>
    <p id="msg" class="msg" role="alert" hidden></p>
  </form>
</main>

async function unlock(pw, d) {
  const b = s => Uint8Array.from(atob(s), ch => ch.charCodeAt(0));
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name: 'PBKDF2', salt: b(d.s), iterations: d.n, hash: 'SHA-256'},
    base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b(d.i)}, key, b(d.c));
  return new TextDecoder().decode(pt);
}
